name: Build & Test (Windows)

# Windows counterpart to build-test-platform.yml, kept as a separate file rather than a third
# branch of it: that workflow is bash end-to-end (tar, sed, `source venv/bin/activate`, POSIX
# paths) for nearly every step, while Windows needs cmd/powershell shells, VsDevCmd.bat, `nmake`
# and PyInstaller-frozen .exe wrappers (tornado.exe, tornado-test.exe) instead of shell scripts.
# Forking almost every step of that file with `if: runner.os == 'Windows'` would hurt readability
# more than a parallel file does. This also mirrors existing precedent: build-release-sdks.yml
# already keeps its Windows job as a self-contained block with its own shells rather than
# interleaving it into the Linux job.
#
# Same build-once-test-on-its-JDKs shape as the other platforms, but simpler: the self-hosted
# Windows runner is only confirmed to have jdk21 and jdk25 installed (see build-release-sdks.yml),
# so there is no floor/newest split and no full-sweep option -- each built SDK is tested only
# against the JDK it was built with (jdk21 SDK -> jdk21, jdk22plus SDK -> jdk25). That pairing is
# computed by the caller (build-test.yml's plan job); this file just consumes it.
#
# Deliberately out of scope for now: the downstream sample-app regression builds (TornadoVM-Ray-
# Tracer, KFusion-TornadoVM) that the Linux/macOS test job also runs. Those are bash/.sh-based and
# unverified on Windows -- this file only runs the core unit-test suite (`fast-tests`).

on:
  workflow_call:
    inputs:
      platform:
        description: "windows (used only for job naming, kept for parity with build-test-platform.yml)"
        required: true
        type: string
      build_matrix:
        description: "JSON matrix object for the Windows build jobs"
        required: true
        type: string
      test_matrix:
        description: "JSON matrix object for the Windows test jobs"
        required: true
        type: string

env:
  # Build/runtime JDK homes. Any JDK >= 22 would produce an identical jdk22plus artifact (see
  # build-test-platform.yml's own JDK22PLUS_BUILD_JAVA_HOME_* comment) -- pinned to jdk25 purely
  # to match build-release-sdks.yml and the other platforms' reproducibility pinning.
  JDK21_HOME: 'C:\jdks\jdk21'
  JDK22PLUS_HOME: 'C:\jdks\jdk25'

jobs:
  build:
    name: build-${{ matrix.sdk }}-${{ matrix.backend }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      VENV_PATH: '${{ github.workspace }}\venv-${{ matrix.backend }}-${{ matrix.sdk }}'
      SDK_TARGET: ${{ matrix.sdk }}
      BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build JDK
        shell: powershell
        run: |
          if ("${{ matrix.sdk }}" -eq "jdk21") {
            $javaHome = $env:JDK21_HOME
          } else {
            $javaHome = $env:JDK22PLUS_HOME
          }
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Every profile other than jdk21 vendors jdk.internal.vm.ci from a real JDK 21 runtime
          # image (bin/build_jvmci_module.py, via pull_graal_jars.py), independent of JAVA_HOME
          # above. That script falls back to a hardcoded sdkman path when JVMCI_SOURCE_JDK is
          # unset -- a fallback that does not exist on Windows (no sdkman), so the jdk22plus build
          # fails deep inside the Maven reactor ("no runtime image at ...; set JVMCI_SOURCE_JDK to
          # a JDK 21 home") without this. Confirmed root cause, documented in
          # scripts/build-release-sdks.py's build_sdk().
          if ("${{ matrix.sdk }}" -ne "jdk21") {
            "JVMCI_SOURCE_JDK=$env:JDK21_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Setup environment
        shell: powershell
        run: |
          "$env:JAVA_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Python venv
        shell: powershell
        run: |
          if (Test-Path $env:VENV_PATH) {
            Remove-Item -Recurse -Force $env:VENV_PATH
          }
          python -m venv "$env:VENV_PATH"
          & "$env:VENV_PATH\Scripts\python.exe" -m pip install --upgrade pip
          # pyinstaller is needed here (unlike Linux/macOS): bin/compile's --sdk build freezes
          # tornado.exe/tornado-test.exe/tornado-benchmarks.exe with it on Windows.
          & "$env:VENV_PATH\Scripts\pip.exe" install requests tqdm urllib3 wget packaging streamlit psutil pyinstaller
          "$env:VENV_PATH\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build TornadoVM (${{ matrix.sdk }}, ${{ matrix.backend }})
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\VsDevCmd.bat" -startdir=none -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          nmake -f Makefile.mak sdk-%SDK_TARGET% BACKEND=%BACKEND%

      - name: Stage the SDK for the test job
        shell: powershell
        run: |
          # dist\<archive-name>\<sdk-dir>\, same two-level shape bin/compile produces on every
          # platform (dist/*/*/ on Linux/macOS).
          $sdkDir = (Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'dist') -Directory |
                     Get-ChildItem -Directory | Select-Object -First 1).FullName
          if (-not $sdkDir) {
            Write-Error "No SDK directory found under dist\"
            exit 1
          }
          Write-Host "Staging $sdkDir"
          Get-Content (Join-Path $sdkDir 'etc\tornado.jdk')
          "SDK_DIR=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-windows-${{ matrix.backend }}-${{ matrix.sdk }}
          path: ${{ env.SDK_DIR }}
          retention-days: 3
          if-no-files-found: error

  test:
    name: test-${{ matrix.sdk }}-on-${{ matrix.jdk }}-${{ matrix.backend }}
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_matrix) }}
    runs-on: ${{ matrix.runner }}
    # Deliberately no `concurrency:` group -- same reasoning as build-test-platform.yml: there is
    # one runner process on the single Windows machine, so jobs already run one at a time.
    steps:
      - uses: actions/checkout@v4

      - name: Resolve runtime JDK (${{ matrix.jdk }})
        shell: powershell
        run: |
          # matrix.jdk is always jdk21 or jdk25 here (see this file's header comment) -- a fixed
          # pairing, not a discovered sweep, so map it directly rather than globbing like
          # build-test-platform.yml does for the larger Linux/macOS JDK inventory.
          if ("${{ matrix.jdk }}" -eq "jdk21") {
            $javaHome = $env:JDK21_HOME
          } else {
            $javaHome = $env:JDK22PLUS_HOME
          }
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/download-artifact@v4
        with:
          name: sdk-windows-${{ matrix.backend }}-${{ matrix.sdk }}
          path: sdk

      - name: Point the environment at the SDK
        shell: powershell
        run: |
          $sdkDir = Join-Path $env:GITHUB_WORKSPACE 'sdk'
          "TORNADOVM_HOME=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:JAVA_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "--- SDK contract:"
          Get-Content (Join-Path $sdkDir 'etc\tornado.jdk')

      - name: Show the JDK actually under test
        shell: cmd
        run: |
          java -version
          "%TORNADOVM_HOME%\bin\tornado.exe" --devices

      - name: Run ${{ matrix.backend }} fast unit tests
        shell: cmd
        run: |
          nmake -f Makefile.mak fast-tests
